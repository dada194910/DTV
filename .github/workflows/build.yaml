name: Build wiliwili

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      disable_unity_build:
        description: 'Disable unity build'
        required: false
        default: 'false'

# 临时聚焦 Switch 构建验证底座（方案A 改造前健康检查）。
# 其余平台 job（win/macos/ps4/flatpak/vita/release）已注释，恢复时取消注释即可。
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      DIST_NRO: ${{ steps.info.outputs.DIST_NRO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Debug version
        run: |
          export VERSION=`git rev-parse --short HEAD`
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Version
        id: info
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "DIST_NRO=wiliwili-NintendoSwitch-${VERSION}" >> $GITHUB_OUTPUT
          echo $VERSION

  build-switch:
    needs: [ version ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: opengl }
          - { driver: deko3d, shuffix: "_deko3d" }
        driver: [opengl, deko3d]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Disable unity build
        if: ${{ github.event.inputs.disable_unity_build == 'true' }}
        run: |
          sed -i 's/BRLS_UNITY_BUILD=ON/BRLS_UNITY_BUILD=OFF/' scripts/build_switch${{ matrix.shuffix }}.sh

      - name: Build Nro
        run: |
          docker run --rm -v $(pwd):/data devkitpro/devkita64:20251117 bash -c "/data/scripts/build_switch${{ matrix.shuffix }}.sh"

      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.version.outputs.DIST_NRO }}-${{ matrix.driver }}
          path: "cmake-build-switch/wiliwili.nro"

#   build-win:
#     needs: [ version ]
#     ... (省略，底座验证通过后再恢复)
